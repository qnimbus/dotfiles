# Keys that chezmoi enforces in /etc/wsl.conf on WSL (see
# .chezmoiscripts/linux/run_before_11-configure-wsl-conf.sh.tmpl).
# They are merged in: other sections and keys already in /etc/wsl.conf (such as
# [user] default=...) are kept. Changes take effect after 'wsl --shutdown'.

[boot]
# Run systemd as PID 1, needed for the docker and containerd services
systemd=true
